name: Test

on:
  push:
    branches:
      - linux-snapshot-generation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --no-save
      - run: bun install --no-save --cwd tests/fixtures/usb-terminal-clearance
      - run: BUN_UPDATE_SNAPSHOTS=1 bun test --timeout 30000 tests/srj18-sample9-pad-repair.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: srj18-linux-snapshot
          path: tests/__snapshots__/srj18-sample9-pad-repair-linux.snap.svg
